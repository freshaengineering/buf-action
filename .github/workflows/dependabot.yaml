name: Dependabot Rebuild
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
  pull-requests: read
jobs:
  build:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: rebuild
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY
          git config user.name github-actions
          git config user.email github-actions@github.com
          make build
          git add -A
          git commit -m "[dependabot skip] build" || true
          git push -u origin HEAD:${{ github.event.pull_request.head.ref }}
